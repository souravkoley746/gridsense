<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GridSense — AI Electricity Consumption Forecasting</title>
  <link rel="icon" href="https://streamlit.io/images/brand/streamlit-mark-color.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0e1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fafafa;
      z-index: 10;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .loading-overlay.hidden {
      opacity: 0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #0284c7;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loader">
    <div class="spinner"></div>
    <div style="font-weight: 500; font-size: 15px; letter-spacing: 0.3px;">Loading GridSense Dashboard...</div>
    <div style="font-size: 12px; color: #888; margin-top: 6px;">AI Electricity Consumption Forecasting</div>
  </div>

  <iframe 
    id="app-frame" 
    src="https://gridsense-wwnbweu6dzfzwxw5b5m5dn.streamlit.app/?embed=true"
    allow="clipboard-read; clipboard-write"
    onload="document.getElementById('loader').classList.add('hidden')"
  ></iframe>
</body>
</html>
